name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Test frontend
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://penny_saved_ci:penny_saved_ci@localhost:5432/penny_saved
      TEST_DATABASE_URL: postgresql+psycopg://penny_saved_ci:penny_saved_ci@localhost:5432/penny_saved_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: penny_saved_test
          POSTGRES_USER: penny_saved_ci
          POSTGRES_PASSWORD: penny_saved_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=penny_saved_ci --dbname=penny_saved_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install pinned backend dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Check backend formatting
        run: python -m ruff format --check .
        working-directory: backend
      - name: Lint backend
        run: python -m ruff check .
        working-directory: backend
      - name: Test backend
        run: python -m pytest
        working-directory: backend
